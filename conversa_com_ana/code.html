  </style>
<script>
    // Simple auto-resize for textarea
    const tx = document.getElementById('chat-input');
    tx.setAttribute('style', 'height:' + (tx.scrollHeight) + 'px;overflow-y:hidden;');
    tx.addEventListener("input", OnInput, false);

    function OnInput() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
      
      // Auto-scroll to bottom when typing pushes content up
      if(this.scrollHeight > 44) {
         const chatContainer = document.getElementById('chat-container');
         chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }
    
    // Quick replies injection demo
    document.querySelectorAll('.bg-secondary-container').forEach(button => {
      button.addEventListener('click', function() {
        tx.value = this.innerText;
        tx.focus();
        OnInput.call(tx);
      });
    });
  </script>
