services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reusa
      POSTGRES_USER: reusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reusa-local-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reusa -d reusa"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    # Debian-based image avoids the Erlang-cookie permission issue observed
    # with the Alpine variant on some Docker Desktop/WSL installations.
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-reusa}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-reusa-local-change-me}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  core:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me}
      DATABASE_PROVIDER: postgres
      AMQP_URL: amqp://${RABBITMQ_USER:-reusa}:${RABBITMQ_PASSWORD:-reusa-local-change-me}@rabbitmq:5672
      EVENT_EXCHANGE: reusa.events
      POSTGRES_URL: postgres://reusa:${POSTGRES_PASSWORD:-reusa-local-change-me}@postgres:5432/reusa
      REDIS_URL: redis://redis:6379
      NOTIFICATION_SERVICE_URL: http://notifications:3001
      IMPACT_SERVICE_URL: http://impact:3002
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-development-service-token-change-me}
    ports:
      - "3000:3000"
    volumes:
      - core-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  notifications:
    build: .
    restart: unless-stopped
    command: node services/notification-service.js
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /data
      DATABASE_PROVIDER: postgres
      POSTGRES_URL: postgres://reusa:${POSTGRES_PASSWORD:-reusa-local-change-me}@postgres:5432/reusa
      AMQP_URL: amqp://${RABBITMQ_USER:-reusa}:${RABBITMQ_PASSWORD:-reusa-local-change-me}@rabbitmq:5672
      EVENT_EXCHANGE: reusa.events
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-development-service-token-change-me}
    volumes:
      - notification-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  impact:
    build: .
    restart: unless-stopped
    command: node services/impact-service.js
    environment:
      NODE_ENV: production
      PORT: 3002
      DATA_DIR: /data
      DATABASE_PROVIDER: postgres
      POSTGRES_URL: postgres://reusa:${POSTGRES_PASSWORD:-reusa-local-change-me}@postgres:5432/reusa
      AMQP_URL: amqp://${RABBITMQ_USER:-reusa}:${RABBITMQ_PASSWORD:-reusa-local-change-me}@rabbitmq:5672
      EVENT_EXCHANGE: reusa.events
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-development-service-token-change-me}
    volumes:
      - impact-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  rabbitmq-data:
  redis-data:
  postgres-data:
  core-data:
  notification-data:
  impact-data:
