name: ReUsa+ Payment Integration Checks

on:
  pull_request:
    paths:
      - 'backend.js'
      - 'storage/postgres-api.js'
      - 'services/mercado-pago.js'
      - 'test/**'
      - 'package*.json'
      - '.github/workflows/mercadopago-checks.yml'
  push:
    branches:
      - feat/mercadopago-orders-checkout

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Backend tests
        run: npm test
        env:
          NODE_ENV: test
      - name: Frontend build
        run: npm run build
