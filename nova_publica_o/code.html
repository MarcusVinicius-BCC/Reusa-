<button class="absolute top-1 right-1 w-6 h-6 bg-error/90 rounded-full flex items-center justify-center text-on-error backdrop-blur-sm">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</div>
</div>
</section>
<!-- Form Fields -->
<section class="flex flex-col gap-6">
<!-- Item Name -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-background" for="itemName">Título do item</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg py-3 px-4 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-on-surface-variant/50" id="itemName" placeholder="Ex: Cadeira de madeira antiga" type="text">
</div>
</div>
<!-- Description -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-background" for="itemDesc">Descrição</label>
<div class="relative">
<textarea class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg py-3 px-4 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all resize-none placeholder:text-on-surface-variant/50" id="itemDesc" placeholder="Descreva os detalhes, defeitos (se houver) e o motivo de estar repassando..." rows="4"></textarea>
</div>
</div>
<!-- Category -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-background">Categoria</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg py-3 pl-4 pr-10 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all">
<option disabled="" selected="" value="">Selecione uma categoria</option>
<option value="moveis">Móveis</option>
<option value="eletronicos">Eletrônicos</option>
<option value="roupas">Roupas</option>
<option value="livros">Livros</option>
<option value="outros">Outros</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Condition Chips -->
<div class="flex flex-col gap-3">
<label class="font-label-md text-label-md text-on-background">Condição</label>
<div class="flex flex-wrap gap-2" id="condition-chips">
<button class="px-4 py-2 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md transition-all active-chip shadow-sm">Novo</button>
<button class="px-4 py-2 rounded-full bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md transition-all shadow-sm">Bom estado</button>
<button class="px-4 py-2 rounded-full bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md transition-all shadow-sm">Marcas de uso</button>

<span class="material-symbols-outlined text-primary">location_on</span>
<span class="font-body-md text-body-md truncate">Usar minha localização atual</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>

<div class="w-full h-32 mt-2 rounded-xl bg-surface-container-highest overflow-hidden relative shadow-sm" data-location="São Paulo, Brazil">
<div class="absolute inset-0 flex items-center justify-center bg-black/10 backdrop-blur-[2px]">

</div>
</div>
</section>

      Publicar anúncio
      <span class="material-symbols-outlined text-[24px]">send</span>
</button>
</div>
</div>
<script>
  // Simple chip selection logic
  document.addEventListener('DOMContentLoaded', () => {
    const chipsContainer = document.getElementById('condition-chips');
    if (chipsContainer) {
      const chips = chipsContainer.querySelectorAll('button');
      chips.forEach(chip => {
        chip.addEventListener('click', (e) => {
          e.preventDefault();
          // Reset all
          chips.forEach(c => {
            c.classList.remove('bg-secondary-container', 'text-on-secondary-container');
            c.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
          });
          // Set active
          const target = e.currentTarget;
          target.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
          target.classList.add('bg-secondary-container', 'text-on-secondary-container');
        });
      });
    }
  });
</script></main>
